name: superset-ci

on:
  pull_request:
    branches:
      - master

permissions:
  id-token: write
  pull-requests: write
  checks: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.actor }}-${{ github.head_ref }}
  cancel-in-progress: true


jobs:
  superset-ci:
    runs-on: [ self-hosted,4v, spot, acc-infraprod, arch-x64 ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::125719378300:role/github-runner-role
          aws-region: ap-southeast-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push docker
        run: |
          docker buildx create --use --driver-opt image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
          docker buildx build \
            --platform linux/arm64 \
            --target dev \
            -t 125719378300.dkr.ecr.ap-southeast-1.amazonaws.com/superset_test:v4_custom_v0.0.20_dev \
            --push .
