name: superset-ci

on:
  pull_request:
    branches:
      - staging
      - master

env:
  GITHUB_BOT_NAME: /sre/github/codebuild/GITHUB_BOT_NAME
  GITHUB_BOT_PAC: /sre/github/codebuild/GITHUB_BOT_PAC
  GITHUB_BOT_EMAIL: /sre/github/codebuild/GITHUB_BOT_EMAIL

permissions:
  id-token: write
  pull-requests: write
  issues: write
  checks: write
  contents: write

jobs: 
  superset-ci:
    runs-on: [self-hosted, 8v, od, ZAnalytics, acc-infraprod, arch-x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check for build command
        id: check-changes
        run: |
          LATEST_COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Latest commit message: $LATEST_COMMIT_MSG"
          if [[ "$LATEST_COMMIT_MSG" == "[build]"* ]]; then
            echo "build_image=true" >> $GITHUB_OUTPUT
            echo "Build triggered by commit message"
          else
            echo "build_image=false" >> $GITHUB_OUTPUT
            echo "Build not triggered - commit message doesn't start with [build]"
          fi

      - name: Verify checkout
        if: steps.check-changes.outputs.build_image == 'true'
        run: |
          echo "=== Git Status ==="
          git status
          echo "=== Current Branch ==="
          git branch -a
          echo "=== Current Commit ==="
          git log --oneline -1
          echo "=== Remote URLs ==="
          git remote -v
          echo "=== Dockerfile verification ==="
          head -20 Dockerfile

      - name: Configure AWS Credentials
        if: steps.check-changes.outputs.build_image == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::125719378300:role/github-runner-role
          aws-region: ap-southeast-1

      - name: Set up Docker Buildx
        if: steps.check-changes.outputs.build_image == 'true'
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - name: Login to Amazon ECR
        if: steps.check-changes.outputs.build_image == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Clean Docker state
        if: steps.check-changes.outputs.build_image == 'true'
        run: |
          echo "=== Cleaning Docker buildx state ==="
          docker buildx ls
          docker buildx rm --all-inactive || true
          docker system prune -f
          
      - name: Set Docker tag
        if: steps.check-changes.outputs.build_image == 'true'
        id: set-tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          RUN_ID=${{ github.run_id }}
          echo "DOCKER_TAG=v4_custom_commit_${SHORT_SHA}_${TIMESTAMP}_${RUN_ID}_dev" >> $GITHUB_ENV
          echo "Building Docker image with SHA: ${SHORT_SHA}, Timestamp: ${TIMESTAMP}, Run ID: ${RUN_ID}"
          echo "Current working directory: $(pwd)"
          echo "Dockerfile exists: $(test -f Dockerfile && echo 'yes' || echo 'no')"

      - name: Build and push docker
        if: steps.check-changes.outputs.build_image == 'true'
        run: |
          docker buildx create --use --driver-opt image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
          docker buildx build \
            --platform linux/amd64 \
            --target dev \
            -t 125719378300.dkr.ecr.ap-southeast-1.amazonaws.com/superset:${DOCKER_TAG} \
            --push .

      - name: Comment Docker image on PR
        uses: actions/github-script@v6
        env:
          build_image: ${{ steps.check-changes.outputs.build_image }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const shouldBuild = process.env.build_image === 'true';
            let message;
            
            if (shouldBuild) {
              const imageName = `125719378300.dkr.ecr.ap-southeast-1.amazonaws.com/superset:${process.env.DOCKER_TAG}`;
              message = `🐳 **Docker Image Built Successfully!**
              
              **Image:** \`${imageName}\`
              
              You can now use this image for testing or deployment.`;
            } else {
              message = `ℹ️ Skipped Docker image build. To trigger a build, start your commit message with "[build]" and push to the PR.`;
            }
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
              console.log('Comment posted successfully');
            } catch (error) {
              console.log('Failed to post comment:', error.message);
              console.log('Continuing workflow without comment...');
            }
