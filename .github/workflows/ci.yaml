name: superset-ci

on:
  pull_request_target:
    branches:
      - staging

permissions:
  id-token: write
  pull-requests: write
  checks: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.actor }}-${{ github.ref }}
  cancel-in-progress: true

jobs: 
  superset-ci:
    runs-on: [self-hosted, 8v, od, ZAnalytics, acc-infraprod, arch-x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::125719378300:role/github-runner-role
          aws-region: ap-southeast-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set Docker tag
        id: set-tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "DOCKER_TAG=staging-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Build and push docker
        run: |
          docker buildx create --use --driver-opt image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
          docker buildx build \
            --platform linux/arm64 \
            --target dev \
            -t 125719378300.dkr.ecr.ap-southeast-1.amazonaws.com/superset:${DOCKER_TAG} \
            --push .
