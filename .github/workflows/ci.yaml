name: superset-ci

on:
  pull_request:
    branches:
      - staging
      - master

env:
  GITHUB_BOT_NAME: /sre/github/codebuild/GITHUB_BOT_NAME
  GITHUB_BOT_PAC: /sre/github/codebuild/GITHUB_BOT_PAC
  GITHUB_BOT_EMAIL: /sre/github/codebuild/GITHUB_BOT_EMAIL

permissions:
  id-token: write
  pull-requests: write
  checks: write
  contents: write

jobs: 
  superset-ci:
    runs-on: [self-hosted, 8v, od, ZAnalytics, acc-infraprod, arch-x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify checkout
        run: |
          echo "=== Git Status ==="
          git status
          echo "=== Current Branch ==="
          git branch -a
          echo "=== Current Commit ==="
          git log --oneline -1
          echo "=== Remote URLs ==="
          git remote -v
          echo "=== Dockerfile verification ==="
          head -20 Dockerfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::125719378300:role/github-runner-role
          aws-region: ap-southeast-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Clean Docker state
        run: |
          echo "=== Cleaning Docker buildx state ==="
          docker buildx ls
          docker buildx rm --all-inactive || true
          docker system prune -f
          
      - name: Set Docker tag
        id: set-tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "DOCKER_TAG=v4_custom_v0.0.27_dev" >> $GITHUB_ENV
          echo "Building Docker image with SHA: ${SHORT_SHA}"
          echo "Current working directory: $(pwd)"
          echo "Dockerfile exists: $(test -f Dockerfile && echo 'yes' || echo 'no')"

      - name: Build and push docker
        run: |
          docker buildx create --use --driver-opt image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
          docker buildx build \
            --platform linux/amd64 \
            --target dev \
            -t 125719378300.dkr.ecr.ap-southeast-1.amazonaws.com/superset:${DOCKER_TAG} \
            --push .
