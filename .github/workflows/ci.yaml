name: superset-ci

on:
  issue_comment:
    types: [created]

env:
  GITHUB_BOT_NAME: /sre/github/codebuild/GITHUB_BOT_NAME
  GITHUB_BOT_PAC: /sre/github/codebuild/GITHUB_BOT_PAC
  GITHUB_BOT_EMAIL: /sre/github/codebuild/GITHUB_BOT_EMAIL

permissions:
  id-token: write
  pull-requests: write
  checks: write
  contents: write

concurrency:
  group: superset-ci-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs: 
  superset-ci:
    runs-on: [self-hosted, 8v, od, ZAnalytics, acc-infraprod, arch-x64]
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/build')
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get PR details
        id: pr
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return pr.data;

      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          ref: ${{ fromJson(steps.pr.outputs.result).head.sha }}

      - name: Verify checkout
        run: |
          echo "=== Git Status ==="
          git status
          echo "=== Current Branch ==="
          git branch -a
          echo "=== Current Commit ==="
          git log --oneline -1
          echo "=== Remote URLs ==="
          git remote -v
          echo "=== Dockerfile verification ==="
          head -20 Dockerfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::125719378300:role/github-runner-role
          aws-region: ap-southeast-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Clean Docker state
        run: |
          echo "=== Cleaning Docker buildx state ==="
          docker buildx ls
          docker buildx rm --all-inactive || true
          docker system prune -f
          
      - name: Set Docker tag
        id: set-tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          RUN_ID=${{ github.run_id }}
          echo "DOCKER_TAG=v4_custom_commit_${SHORT_SHA}_${TIMESTAMP}_${RUN_ID}_dev" >> $GITHUB_ENV
          echo "Building Docker image with SHA: ${SHORT_SHA}, Timestamp: ${TIMESTAMP}, Run ID: ${RUN_ID}"
          echo "Current working directory: $(pwd)"
          echo "Dockerfile exists: $(test -f Dockerfile && echo 'yes' || echo 'no')"

      - name: Build and push docker
        run: |
          docker buildx create --use --driver-opt image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
          docker buildx build \
            --platform linux/amd64 \
            --target dev \
            -t 125719378300.dkr.ecr.ap-southeast-1.amazonaws.com/superset:${DOCKER_TAG} \
            --push .

      - name: Comment Docker image on PR
        uses: actions/github-script@v6
        if: success()
        with:
          script: |
            const imageName = `125719378300.dkr.ecr.ap-southeast-1.amazonaws.com/superset:${process.env.DOCKER_TAG}`;
            const comment = `🐳 **Docker Image Built Successfully!**
            
            **Image:** \`${imageName}\`
            
            You can now use this image for testing or deployment.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
